name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1 -Force

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          $existing = Get-LocalUser -Name 'RDP' `
            -ErrorAction SilentlyContinue

          Add-Type -AssemblyName System.Security

          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)

          $password = [Convert]::ToBase64String($bytes) + 'aA1!'
          $securePass = ConvertTo-SecureString `
            $password -AsPlainText -Force

          if ($existing) {
            Set-LocalUser -Name 'RDP' -Password $securePass
          } else {
            New-LocalUser -Name 'RDP' `
              -Password $securePass `
              -AccountNeverExpires
          }

          Add-LocalGroupMember -Group 'Administrators' `
            -Member 'RDP' -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group 'Remote Desktop Users' `
            -Member 'RDP' -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $installerPath = Join-Path $env:TEMP 'tailscale.msi'

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Start-Process msiexec.exe `
            -ArgumentList '/i', "`"$installerPath`"", '/quiet', '/norestart' `
            -Wait

          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not $env:TS_AUTHKEY) {
            throw 'Configura el secreto TAILSCALE_AUTH_KEY en GitHub.'
          }

          & $tsExe up `
            "--authkey=$env:TS_AUTHKEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw 'No se pudo iniciar Tailscale.'
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12 -and -not $tsIP; $i++) {
            Start-Sleep -Seconds 5
            $tsIP = (& $tsExe ip -4 | Select-Object -First 1).Trim()
          }

          if (-not $tsIP) {
            throw 'Tailscale no asignó una dirección IP.'
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            Write-Warning 'No se pudo verificar el puerto 3389.'
            Write-Warning 'Comprueba el servicio RDP y el firewall.'
          } else {
            Write-Host 'Conexión TCP disponible.'
          }

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ''
          Write-Host '=== RDP ACCESS ==='
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host 'Username: RDP'
          Write-Host 'Password: disponible en el secreto temporal del job'
          Write-Host '=================='

          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active"
            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $tsExe) {
            & $tsExe down
          }
