name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          $service = Get-Service -Name TermService
          if ($service.Status -ne 'Running') {
            Start-Service -Name TermService
          }

          Write-Host "RDP configuration checked."

      - name: Create RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "RDP"

          $existing = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
            throw "The RDP account already exists. Use an authorized existing account or configure account rotation."
          }

          $password = [System.Web.Security.Membership]::GeneratePassword(24, 4)
          $securePassword = ConvertTo-SecureString `
            $password -AsPlainText -Force

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires | Out-Null

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          "RDP_USERNAME=$username" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "RDP_PASSWORD=$password" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "RDP account created."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path $env:TEMP "tailscale.msi"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList @("/i", "`"$installer`"", "/quiet", "/norestart") `
            -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -ne 0) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

      - name: Connect to Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Configure the TAILSCALE_AUTH_KEY repository secret."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale executable not found."
          }

          & $ts up "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale authentication failed."
          }

          $ip = & $ts ip -4

          if ($LASTEXITCODE -ne 0 -or
              [string]::IsNullOrWhiteSpace(($ip -join ""))) {
            throw "Could not obtain the Tailscale IPv4 address."
          }

          "TAILSCALE_IP=$($ip[0])" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Tailscale connection established."

      - name: Verify RDP Service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service -Name TermService

          if ($service.Status -ne 'Running') {
            throw "Remote Desktop service is not running."
          }

          $listener = Get-NetTCPConnection `
            -State Listen -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "No process is listening on TCP port 3389."
          }

          Write-Host "RDP service and listener verified."
          Write-Host "Tailscale IPv4: $env:TAILSCALE_IP"

      - name: Keep Runner Alive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Runner setup completed."
          Write-Host "The job will end at its configured timeout."

          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner active."
            Start-Sleep -Seconds 300
          }
